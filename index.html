<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3a2418">
  <meta name="description" content="An interactive, scroll-driven journey through a panoramic Indian bazaar.">
  <title>Indian Bazaar — Interactive Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bazaar-brown: #3a2418;
      --ink: #2b1a12;
      --paper: #fffdf5;
      --world-width: 9000px;
      --hero-width: clamp(100px, 12vh, 180px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background: var(--bazaar-brown);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    #vp {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      isolation: isolate;
    }

    #vp.is-dragging { cursor: grabbing; }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--world-width);
      height: 100vh;
      height: 100dvh;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      pointer-events: none;
    }

    #bazaar-image {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #image-error {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 30;
      max-width: min(560px, calc(100vw - 24px));
      padding: 10px 14px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: #3a2418;
      color: #fff;
      font: 14px/1.4 Georgia, serif;
    }

    .spot {
      position: absolute;
      top: 0;
      height: 100%;
      pointer-events: auto;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .spot:focus-visible {
      outline: 3px dashed #fff;
      outline-offset: -8px;
    }

    .cloud {
      position: absolute;
      left: 50%;
      bottom: clamp(145px, 24vh, 260px);
      width: max-content;
      max-width: min(250px, 80vw);
      padding: 12px 16px 13px;
      transform: translate(-50%, 12px) scale(.92);
      transform-origin: center bottom;
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 4px 5px 0 rgba(43, 26, 18, .28);
      text-align: center;
      line-height: 1.15;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, transform .24s cubic-bezier(.2,.8,.2,1), visibility .2s;
      pointer-events: none;
      z-index: 5;
    }

    .cloud::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -13px;
      width: 20px;
      height: 20px;
      background: var(--paper);
      border-right: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      transform: translateX(-50%) rotate(45deg);
      border-bottom-right-radius: 3px;
    }

    .cloud strong {
      display: block;
      font-size: clamp(15px, 2vh, 20px);
      font-weight: 700;
      white-space: nowrap;
    }

    .cloud span {
      display: block;
      margin-top: 5px;
      font: 12px/1.25 Georgia, "Times New Roman", serif;
      opacity: .8;
    }

    .spot.near .cloud {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0) scale(1);
      animation: cloud-bob 2.1s ease-in-out infinite;
    }

    .spot:hover .cloud,
    .spot:focus-visible .cloud {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0) scale(1);
    }

    @keyframes cloud-bob {
      0%, 100% { margin-bottom: 0; }
      50% { margin-bottom: 7px; }
    }

    #hero {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 10;
      width: var(--hero-width);
      height: clamp(180px, 34vh, 360px);
      transform: translateX(-50%);
      pointer-events: none;
      background: transparent;
    }

    #hero-character {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(2px 3px 0 rgba(35, 18, 10, .18));
    }

    #hero-character {
      transform-origin: 50% 100%;
      animation: hero-walk-bob .34s ease-in-out infinite alternate;
    }

    #hero-character .leg,
    #hero-character .arm {
      transform-box: view-box;
      transform-origin: 50% 12%;
      animation-duration: .42s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    #hero-character .leg-left { animation-name: leg-left-swing; }
    #hero-character .leg-right { animation-name: leg-right-swing; }
    #hero-character .arm-left { animation-name: arm-left-swing; }
    #hero-character .arm-right { animation-name: arm-right-swing; }

    @keyframes hero-walk-bob {
      from { transform: translateY(0) rotate(-1deg); }
      to { transform: translateY(-4px) rotate(1deg); }
    }
    @keyframes leg-left-swing {
      from { transform: rotate(8deg); }
      to { transform: rotate(-8deg); }
    }
    @keyframes leg-right-swing {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }
    @keyframes arm-left-swing {
      from { transform: rotate(-7deg); }
      to { transform: rotate(7deg); }
    }
    @keyframes arm-right-swing {
      from { transform: rotate(7deg); }
      to { transform: rotate(-7deg); }
    }

    /* Optional tiny orientation hint; disappears after the first interaction. */
    #hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 20;
      transform: translateX(-50%);
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      background: rgba(35, 21, 14, .78);
      color: #fff8e9;
      font: 12px/1.2 Georgia, "Times New Roman", serif;
      letter-spacing: .02em;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    #hint.is-hidden { opacity: 0; }

    #ov {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background: rgba(14, 9, 6, .88);
      opacity: 0;
      transition: opacity .18s ease;
    }

    #ov.is-open {
      display: flex;
      opacity: 1;
    }

    #toy-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0c0f14;
    }

    #close-modal {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 2;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 3px solid #24160f;
      border-radius: 50%;
      background: #fffdf5;
      color: #24160f;
      box-shadow: 3px 3px 0 rgba(0,0,0,.3);
      font: 700 28px/1 Georgia, serif;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    #close-modal:hover { transform: scale(1.06); background: #ffe4a8; }
    #close-modal:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main id="vp" aria-label="Interactive Indian bazaar. Drag horizontally to explore.">
    <div id="world">
      <img
        id="bazaar-image"
        src="./EXTREAMEFINALALLCLEANEDUPIMAGE_no_watermark_2.png"
        alt="A long illustrated Indian bazaar street with colourful shops and street life"
        draggable="false"
      >
      <div id="shops" aria-label="Interactive storefronts"></div>
    </div>
  </main>

  <!-- Temporary visible protagonist. Replace this SVG with your own character SVG later. -->
  <div id="hero" aria-hidden="true">
    <svg id="hero-character" viewBox="0 0 120 250" role="presentation" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="239" rx="32" ry="7" fill="#1b100b" opacity=".28"/>
      <path d="M39 83 Q60 72 81 83 L88 153 Q60 165 32 153 Z" fill="#d94c35" stroke="#2b1a12" stroke-width="4" stroke-linejoin="round"/>
      <path d="M43 88 L60 111 L77 88" fill="#f3c66d" stroke="#2b1a12" stroke-width="3" stroke-linejoin="round"/>
      <path class="arm arm-left" d="M39 92 L21 133 Q18 140 25 144 Q31 147 35 139 L51 113" fill="#c8794b" stroke="#2b1a12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="arm arm-right" d="M81 92 L99 130 Q103 138 96 142 Q89 145 85 136 L69 113" fill="#c8794b" stroke="#2b1a12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="leg leg-left" d="M43 151 L42 207 Q41 216 32 225 L28 234 Q28 239 36 239 L55 239 Q61 237 58 230 L58 164" fill="#344e70" stroke="#2b1a12" stroke-width="4" stroke-linejoin="round"/>
      <path class="leg leg-right" d="M77 151 L78 207 Q79 216 88 225 L92 234 Q92 239 84 239 L65 239 Q59 237 62 230 L62 164" fill="#344e70" stroke="#2b1a12" stroke-width="4" stroke-linejoin="round"/>
      <path d="M42 205 L58 205 M62 205 L78 205" stroke="#f3c66d" stroke-width="3"/>
      <path d="M29 235 L54 235 M66 235 L91 235" stroke="#2b1a12" stroke-width="5" stroke-linecap="round"/>
      <circle cx="60" cy="48" r="31" fill="#c8794b" stroke="#2b1a12" stroke-width="4"/>
      <path d="M29 45 Q25 13 58 12 Q88 11 92 42 L83 33 Q61 27 41 36 Z" fill="#2b1a12" stroke="#2b1a12" stroke-width="3" stroke-linejoin="round"/>
      <path d="M43 51 Q48 55 53 51 M67 51 Q72 55 77 51" fill="none" stroke="#2b1a12" stroke-width="3" stroke-linecap="round"/>
      <path d="M51 65 Q60 72 70 64" fill="none" stroke="#2b1a12" stroke-width="3" stroke-linecap="round"/>
      <path d="M47 80 L60 91 L73 80" fill="#f3c66d" stroke="#2b1a12" stroke-width="3" stroke-linejoin="round"/>
      <path d="M33 31 Q58 2 88 27" fill="none" stroke="#f3c66d" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
  <div id="hint" aria-hidden="true">Drag to explore the bazaar · Click a shop to enter</div>

  <section id="ov" role="dialog" aria-modal="true" aria-label="Interactive shop experience">
    <button id="close-modal" type="button" aria-label="Close shop experience" title="Close (Esc)">×</button>
    <iframe
      id="toy-frame"
      title="Interactive shop experience"
      src="about:blank"
      allow="autoplay; fullscreen; gamepad"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </section>

  <script>
    (() => {
      "use strict";

      const SHOPS = [
        { name: "Gupta Curios", detail: "CD Storage Tower", src: "cd-tower.html", xStart: 12, xEnd: 17 },
        { name: "PCO", detail: "Yellow Payphone", src: "finalpayphone.html", xStart: 28, xEnd: 31 },
        { name: "Laxmi Tea", detail: "Cutting Chai", src: "teapouring.html", xStart: 42, xEnd: 46 },
        { name: "Mitthu Parrot", detail: "Computer Kundli", src: "fortuneteller.html", xStart: 54, xEnd: 57 },
        { name: "3D Fortune", detail: "Weight Scale", src: "3dfortunescale.html", xStart: 64, xEnd: 67 },
        { name: "Ajanta Studio", detail: "90s Photo Booth", src: "ajantastudio.html", xStart: 72, xEnd: 77 },
        { name: "Dard Gang HQ", detail: "Cyberdisc Studio", src: "Artstyleselector.html", xStart: 84, xEnd: 87 },
        { name: "Tata 1613 SE", detail: "Cabin Simulator", src: "tata-truck/index.html", xStart: 92, xEnd: 97 }
      ];

      const viewport = document.getElementById("vp");
      const world = document.getElementById("world");
      const shopsRoot = document.getElementById("shops");
      const overlay = document.getElementById("ov");
      const frame = document.getElementById("toy-frame");
      const closeButton = document.getElementById("close-modal");
      const hint = document.getElementById("hint");

      let targetX = 0;
      let currentX = 0;
      let maxScroll = 0;
      let isDragging = false;
      let pointerStartX = 0;
      let dragStartX = 0;
      let activeShop = null;
      let previousFocus = null;
      let hasInteracted = false;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      function worldWidth() {
        return world.getBoundingClientRect().width;
      }

      function measureBounds() {
        maxScroll = Math.max(0, worldWidth() - viewport.clientWidth);
        targetX = clamp(targetX, -maxScroll, 0);
        currentX = clamp(currentX, -maxScroll, 0);
        world.style.transform = `translate3d(${currentX}px, 0, 0)`;
      }

      function buildShops() {
        const fragment = document.createDocumentFragment();

        SHOPS.forEach((shop, index) => {
          const spot = document.createElement("button");
          spot.type = "button";
          spot.className = "spot";
          spot.dataset.index = String(index);
          spot.dataset.xStart = String(shop.xStart);
          spot.dataset.xEnd = String(shop.xEnd);
          spot.style.left = `${shop.xStart}%`;
          spot.style.width = `${shop.xEnd - shop.xStart}%`;
          spot.setAttribute("aria-label", `Enter ${shop.name}: ${shop.detail}`);
          spot.setAttribute("aria-haspopup", "dialog");

          const cloud = document.createElement("span");
          cloud.className = "cloud";
          cloud.setAttribute("aria-hidden", "true");

          const name = document.createElement("strong");
          name.textContent = shop.name;
          const detail = document.createElement("span");
          detail.textContent = `${shop.detail} · Click to enter`;

          cloud.append(name, detail);
          spot.append(cloud);
          spot.addEventListener("click", () => openShop(shop, spot));
          fragment.append(spot);
        });

        shopsRoot.append(fragment);
      }

      function markInteracted() {
        if (hasInteracted) return;
        hasInteracted = true;
        hint.classList.add("is-hidden");
      }

      function openShop(shop, trigger) {
        if (isDragging) return;
        previousFocus = trigger || document.activeElement;
        activeShop = shop;
        frame.src = shop.src;
        overlay.classList.add("is-open");
        overlay.style.display = "flex";
        document.body.style.cursor = "default";
        closeButton.focus({ preventScroll: true });
        markInteracted();
      }

      function closeShop() {
        if (!overlay.classList.contains("is-open")) return;
        overlay.classList.remove("is-open");
        overlay.style.display = "none";
        // Removing the document from the iframe stops its audio and active scripts.
        frame.src = "about:blank";
        activeShop = null;
        if (previousFocus && typeof previousFocus.focus === "function") {
          previousFocus.focus({ preventScroll: true });
        }
        previousFocus = null;
        viewport.focus?.({ preventScroll: true });
      }

      function setPointerPosition(clientX) {
        targetX = clamp(dragStartX + (clientX - pointerStartX), -maxScroll, 0);
      }

      viewport.addEventListener("pointerdown", (event) => {
        if (overlay.classList.contains("is-open") || event.button !== 0) return;
        isDragging = true;
        pointerStartX = event.clientX;
        dragStartX = targetX;
        viewport.classList.add("is-dragging");
        viewport.setPointerCapture?.(event.pointerId);
        markInteracted();
      });

      viewport.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        setPointerPosition(event.clientX);
      });

      function endDrag(event) {
        if (!isDragging) return;
        isDragging = false;
        viewport.classList.remove("is-dragging");
        if (event && viewport.hasPointerCapture?.(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }
      }

      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);
      viewport.addEventListener("lostpointercapture", () => {
        isDragging = false;
        viewport.classList.remove("is-dragging");
      });

      // Wheel input is optional but makes desktop exploration feel natural.
      viewport.addEventListener("wheel", (event) => {
        if (overlay.classList.contains("is-open")) return;
        const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
        if (delta === 0) return;
        event.preventDefault();
        targetX = clamp(targetX - delta, -maxScroll, 0);
        markInteracted();
      }, { passive: false });

      closeButton.addEventListener("click", closeShop);
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeShop();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeShop();
        if (overlay.classList.contains("is-open") && event.key === "Tab") {
          // Keep keyboard focus within the modal's close control.
          event.preventDefault();
          closeButton.focus();
        }
      });

      function updateProximity() {
        const width = worldWidth();
        if (!width) return;

        // The protagonist is screen-fixed at the viewport center. Convert that
        // screen position into a percentage of the translated world.
        const heroWorldX = (viewport.clientWidth / 2) - currentX;
        const heroPercent = (heroWorldX / width) * 100;

        shopsRoot.querySelectorAll(".spot").forEach((spot) => {
          const start = Number(spot.dataset.xStart);
          const end = Number(spot.dataset.xEnd);
          const near = heroPercent >= start && heroPercent <= end;
          spot.classList.toggle("near", near);
          spot.setAttribute("aria-expanded", near ? "true" : "false");
        });
      }

      function animate() {
        // Exponential smoothing: independent of frame rate and gentle on trackpads.
        const lerpFactor = isDragging ? 0.42 : 0.12;
        currentX += (targetX - currentX) * lerpFactor;
        if (Math.abs(targetX - currentX) < 0.1) currentX = targetX;
        currentX = clamp(currentX, -maxScroll, 0);
        world.style.transform = `translate3d(${currentX}px, 0, 0)`;
        updateProximity();
        requestAnimationFrame(animate);
      }

      // Prevent the panorama image itself from initiating browser drag behavior.
      const bazaarImage = document.getElementById("bazaar-image");
      bazaarImage.addEventListener("dragstart", (event) => event.preventDefault());
      bazaarImage.addEventListener("error", () => {
        document.getElementById("image-error").style.display = "block";
      });
      bazaarImage.addEventListener("load", () => {
        document.getElementById("image-error").style.display = "none";
      });

      buildShops();
      measureBounds();
      window.addEventListener("resize", measureBounds, { passive: true });
      window.addEventListener("orientationchange", measureBounds, { passive: true });
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
