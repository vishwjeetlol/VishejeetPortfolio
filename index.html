<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Bazaar</title>
<style>
:root{--ink:#2a1a14;--paper:#f6e7c8;--accent:#d6336c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#3a2418;overscroll-behavior:none;font-family:Georgia,serif;color:var(--ink)}
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#vp.drag{cursor:grabbing}
#world{position:absolute;top:0;left:0;height:100vh;width:1150vh;padding-right:50vw;will-change:transform}
#world>img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.spot{position:absolute;left:var(--x);top:var(--y,45%);width:var(--w);height:var(--h,36%);cursor:pointer;border-radius:6px}
body.debug .spot{background:rgba(214,51,108,.25);outline:1px dashed var(--accent)}
.cloud{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%) scale(.6);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;background:#fff;border:3px solid var(--ink);border-radius:28px;padding:8px 18px;font-size:15px;text-align:center;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
.cloud b{display:block;font-size:16px}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border:3px solid var(--ink);border-radius:50%}
.cloud::before{width:14px;height:14px;left:50%;bottom:-21px}
.cloud::after{width:8px;height:8px;left:calc(50% + 12px);bottom:-33px}
.spot.near .cloud{opacity:1;transform:translate(-50%,-100%) scale(1);pointer-events:auto;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translate(-50%,-100%)}to{transform:translate(-50%,calc(-100% - 8px))}}
#hero{position:fixed;left:50%;bottom:5%;height:24vh;aspect-ratio:100/165;transform:translateX(-50%);z-index:20;pointer-events:none}
#hero svg{width:100%;height:100%;overflow:visible}
#ov{position:fixed;inset:0;z-index:40;background:rgba(20,10,6,.9);display:none}
#ov.open{display:block}
#ov iframe{width:100%;height:100%;border:0}
#x{position:absolute;top:12px;right:14px;z-index:2;font:700 18px Georgia,serif;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:25;padding:6px 14px;border-radius:20px;background:rgba(246,231,200,.93);font-size:13px;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#hint.gone{opacity:0}
</style>
</head>
<body>
<main id="vp">
<div id="world">
  <img id="bg" src="EXTREAMEFINALALLCLEANEDUPIMAGE_no_watermark_2 8.45.04 PM.png" alt="Panoramic Indian street bazaar" draggable="false">
  <!-- x / w are % of the world width; press D to see the hitboxes -->
  <div class="spot" style="--x:12.05%;--w:2.71%" data-t="Laxmi Tea" data-src="games/tea.html"><div class="cloud"><b>Laxmi Tea</b>Click to pour a chai</div></div>
  <div class="spot" style="--x:27.26%;--w:5.12%" data-t="Ajanta Photo Studio" data-src="games/photobooth.html"><div class="cloud"><b>Ajanta Photo Studio</b>Click to get your photo</div></div>
  <div class="spot" style="--x:32.6%;--w:1.88%" data-t="PCO Payphone" data-src="games/payphone.html"><div class="cloud"><b>PCO Payphone</b>Click to make a call</div></div>
  <div class="spot" style="--x:62.49%;--y:28%;--w:5.27%;--h:52%" data-t="Gupta Curios" data-src="games/cd-tower.html"><div class="cloud"><b>Gupta Curios</b>Click to browse the CDs</div></div>
  <div class="spot" style="--x:69.27%;--y:28%;--w:4.14%;--h:52%" data-t="Fortune Teller" data-src="games/fortune-teller.html"><div class="cloud"><b>Fortune Teller</b>Click to hear your fortune</div></div>
  <div class="spot" style="--x:82%;--y:32%;--w:9%;--h:55%" data-t="Truck Life" data-src="../truck-cabin.html"><div class="cloud"><b>Truck Life</b>Click to experience the truck life</div></div>
</div>
</main>

<div id="hero" aria-hidden="true"><svg id="hs" viewBox="0 0 100 165" fill="none" stroke="#2a1a14" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></svg></div>
<div id="hint">Scroll, drag or use ← → keys. Walk up to a shop and click the cloud.</div>
<div id="ov"><button id="x" aria-label="Close">✕</button><iframe id="fr" allow="autoplay; fullscreen" title="game"></iframe></div>

const SK='#c68a5c', SKB='#b27647', TEE='#26262c';
const leg=(id,c)=>`<g id="${id}"><rect x="-8.5" y="-4" width="17" height="38" rx="8.5" fill="${c}"/><g id="${id}k"><rect x="-7.5" y="-3" width="15" height="36" rx="7.5" fill="${c}"/><g id="${id}f"><path d="M-8 -3h14c9 0 15 5 15 10v4h-29z" fill="#2b2b30"/><path d="M-8 8h29" stroke="#f1ece0" stroke-width="3.5"/></g></g></g>`;
const arm=(id,s)=>`<g id="${id}"><rect x="-5" y="-3" width="10" height="26" rx="5" fill="${s}"/><g id="${id}e"><rect x="-4.5" y="-2" width="9" height="22" rx="4.5" fill="${s}"/><circle cy="21" r="5.5" fill="${s}"/></g><rect x="-7.5" y="-6" width="15" height="16" rx="5" fill="${TEE}"/></g>`;
$('hs').innerHTML=`<ellipse cx="48" cy="160" rx="27" ry="4" fill="#000" opacity=".25" stroke="none"/>
<g id="bd">${leg('lB','#2f4766')}${leg('lF','#3d5a80')}
<g id="up">${arm('aB',SKB)}
<rect x="28" y="38" width="36" height="54" rx="13" fill="${TEE}"/><circle cx="46" cy="62" r="7" fill="#e9e4d4" stroke-width="1.5"/>
<g id="hd"><rect x="40" y="30" width="12" height="12" rx="3" fill="${SK}"/><ellipse cx="46" cy="20" rx="15" ry="17" fill="${SK}"/>
<circle cx="34" cy="23" r="3.5" fill="${SK}"/><path d="M30 20C27 2 63 -3 62 19C58 11 52 9 46 10C40 10 34 12 30 20Z" fill="#1a1410"/>

${arm('aF',SK)}</g></g>`;
const set=(id,t)=>$(id).setAttribute('transform',t);
function pose(p,w,t){
  const L=ph=>{const s=Math.sin(ph),c=Math.cos(ph),th=30*s*w,kn=(6+46*Math.max(0,-c))*w;
    return {th,kn,ft:-(th+kn)+22*Math.max(0,s)*s*w};};
  const f=L(p), b=L(p+Math.PI);
  [['lF',f],['lB',b]].forEach(([id,q])=>{
    set(id,`translate(46 84) rotate(${q.th})`);set(id+'k','translate(0 32) rotate('+q.kn+')');set(id+'f','translate(0 32) rotate('+q.ft+')');});
  const A=(id,th)=>{const a=-th*.9;set(id,`translate(46 46) rotate(${a})`);set(id+'e',`translate(0 21) rotate(${-(10+.7*Math.max(0,-a))*Math.max(w,.35)})`);};
  A('aF',b.th); A('aB',f.th);
  const bob=-3*Math.abs(Math.cos(p))*w+Math.sin(t/420)*.8*(1-w);
  set('bd',`translate(0 ${bob})`);
  set('up',`rotate(${5*w+Math.sin(t/420)*.6*(1-w)} 46 88)`);
  set('hd',`rotate(${-3*w} 46 40)`);
}

/* ---------- Layout / scrolling ---------- */
const EASE=.085, RATIO=13281/1536;
let pos=0,target=0,maxScroll=0,worldW=0;
const clamp=v=>Math.min(maxScroll,Math.max(0,v));
function layout(){
  const r=bg.naturalWidth?bg.naturalWidth/bg.naturalHeight:RATIO;
  worldW=innerHeight*r; world.style.width=worldW+'px';
  maxScroll=Math.max(0,worldW-innerWidth); target=clamp(target); pos=clamp(pos);
  spots.forEach(s=>{s._c=(parseFloat(s.style.getPropertyValue('--x'))+parseFloat(s.style.getPropertyValue('--w'))/2)/100*worldW; s._hw=parseFloat(s.style.getPropertyValue('--w'))/200*worldW;});
}
addEventListener('resize',layout); bg.addEventListener('load',layout); layout();
const dismiss=()=>hint.classList.add('gone');

vp.addEventListener('wheel',e=>{e.preventDefault();
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  target=clamp(target+d*(e.deltaMode===1?32:1));dismiss();},{passive:false});
let drag=false,lx=0,moved=0;
vp.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;moved=0;vp.classList.add('drag');});
addEventListener('pointermove',e=>{if(!drag)return;const d=e.clientX-lx;lx=e.clientX;moved+=Math.abs(d);target=clamp(target-d*1.4);if(moved>6)dismiss();});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{drag=false;vp.classList.remove('drag');}));

function open(src){if(G[src]){const bin=atob(G[src]),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
  fr.removeAttribute('src');fr.srcdoc=new TextDecoder('utf-8').decode(u);}else{fr.removeAttribute('srcdoc');fr.src=src;}ov.classList.add('open');}
function close(){ov.classList.remove('open');fr.removeAttribute('srcdoc');fr.src='about:blank';}
$('x').addEventListener('click',close);
spots.forEach(s=>s.addEventListener('click',()=>{if(moved<6)open(s.dataset.src);}));
addEventListener('keydown',e=>{
  if(ov.classList.contains('open')){if(e.key==='Escape')close();return;}
  const k=e.key,step=innerWidth*.18;
  if(k==='ArrowRight')target=clamp(target+step);
  else if(k==='ArrowLeft')target=clamp(target-step);
  else if(k==='Home')target=0; else if(k==='End')target=maxScroll;
  else if(k==='Enter'||k.toLowerCase()==='e'){const n=document.querySelector('.spot.near');if(n)open(n.dataset.src);return;}
  else if(k.toLowerCase()==='d'){document.body.classList.toggle('debug');return;}
  else return;
  dismiss();
});

/* ---------- Main loop: inertia, walk cycle, proximity clouds ---------- */
let speed=0,phase=0,facing=1,w=0;
function frame(t){
  const prev=pos; pos+=(target-pos)*EASE; if(Math.abs(target-pos)<.05)pos=target;
  const dx=pos-prev; world.style.transform=`translate3d(${-pos}px,0,0)`;
  speed+=(dx-speed)*.2;
  const walking=Math.abs(speed)>.4;
  if(walking){facing=speed>0?1:-1; phase+=Math.max(-.6,Math.min(.6,dx/(innerHeight*.027)));}
  w+=((walking?1:0)-w)*.12;
  hero.style.transform=`translateX(-50%) scaleX(${facing})`;
  pose(phase,w,t);
  const hx=pos+innerWidth/2;
  spots.forEach(s=>s.classList.toggle('near',Math.abs(hx-s._c)<s._hw+160));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
